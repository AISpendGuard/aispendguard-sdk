name: Publish to npm

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: |
          echo "Node version:"
          node --version
          echo "npm version:"
          npm --version
          echo "npmrc contents:"
          cat ~/.npmrc 2>/dev/null || echo "no .npmrc"
          cat .npmrc 2>/dev/null || echo "no local .npmrc"
          echo "npm whoami:"
          npm whoami 2>&1 || echo "not logged in"
          echo "npm config list:"
          npm config list
          echo "---"
          npm publish --provenance --access public 2>&1
